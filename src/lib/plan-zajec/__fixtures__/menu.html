function showItem( nr, poz, doc)
{
	var ret = 1;
	if (nr != 0 )
    	doc.write("</td><td align=right width=10></td></tr>");

    doc.write("<tr><td width=10></td><td nowrap>");

	//////////////////////////////////////////////////////////////////////
	// przesuniecie w prawo w zaleznosci od poziomu
	if (nr != 0 ) doc.write("&nbsp;")
	for ( var iter = 1; iter < poz; iter++)
	 if (las[iter]==0) doc.write("<img border=0 align=absbottom height=16 src='./images/menu/vert.gif'>")
	 else              doc.write("<img border=0 align=absbottom height=16 src='./images/menu/empt.gif'>");



	if ( items[nr].show != - 1)
	{
	 // doc.write("<a href='javascript:top.clickFolder("+nr+");' onmousemove='javascript:top.overFolder("+nr+")'>");
	    doc.write("<a href=\"javascript:top.clickFolder("+nr+")\" onmousemove=\"javascript:top.overFolder("+nr+")\" title=\""+items[nr].opis+"\">");

	  if ( nr != 0)
	  if ( items[nr].show == 1)
	  {
	  	if ( las[poz]==1) doc.write("<img border=0 align=absbottom height=16 src='./images/menu/minusl.gif'>")
		else              doc.write("<img border=0 align=absbottom height=16 src='./images/menu/minus.gif'>");

	  }
	  else
	  {
	  	if ( las[poz]==1) doc.write("<img border=0 align=absbottom height=16 src='./images/menu/plusl.gif'>")
	  	else              doc.write("<img border=0 align=absbottom height=16 src='./images/menu/plus.gif'>");
	  };



	  if ( items[nr].show == 1) doc.write("<img border=0 align=absbottom height=16 src='./images/menu/_open.gif'>")
	  else                      doc.write("<img border=0 align=absbottom height=16 src='./images/menu/_close.gif'>");
	}
	else
	{
	  if ( las[poz]==1) doc.write("<img border=0 align=absbottom height=16 src='./images/menu/crosl.gif'>")
	  else              doc.write("<img border=0 align=absbottom height=16 src='./images/menu/crosm.gif'>");

	  //doc.write("<a href='javascript:top.clickFolder("+nr+")' onmousemove='javascript:top.overFolder("+nr+")'>");
	  doc.write("<a href=\"javascript:top.clickFolder("+nr+")\" onmousemove=\"javascript:top.overFolder("+nr+")\" title=\""+items[nr].opis+"\">");



	};

	if ( nr==0 || nr == nr_bold) doc.write("<b>");
	doc.write("&nbsp;" + items[nr].name);
	if ( nr==0 || nr == nr_bold) doc.write("</b>");

	doc.write("</a>");

	//////////////////////////////////////////////////////////////////
	// pokazuje podmenu tego itema
	if (items[nr].show == 1)
	   for ( var p in men[nr])
	   {
	    	if (men[nr].length-1 == p) las[poz+1]=1
	        else  las[poz+1]=0;
	        ret += showItem(men[nr][p], poz+1, doc);
	   };

        if (nr == 0 )
        doc.write("</td><td align=right width=10></td></tr>");
return ret;
};

function CItem ( name, show, action, opis)
{
	this.length = 5;
	this.name = name;
	this.action = action;
	this.show = show;        //-1-analityk   0-syn   1-synshow
	this.opis = opis;
};


function appendChild( parent, name, show, action, opis)
{
  nr = items.length;
  items[nr] = new CItem ( name, show, action, opis);
  if ( parent != -1) men[parent][men[parent].length] = nr;
  if (show != -1) men[nr] = new Array;

  return nr;
};
