name: CI

# Bramka dla `main`. Powstała po tym, jak niedokończona podstrona wywróciła
# build produkcyjny — bez CI takie rzeczy wychodzą dopiero przy wdrożeniu.
#
# Dostępność jest w tym projekcie wymogiem twardym, nie miłym dodatkiem, więc
# testy a11y, reduced-motion i mobilne mają własną bramkę, a nie tylko lokalny
# przebieg „kiedy ktoś pamięta".

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Szybka pętla: sekundy, nie minuty. Ma się wywalić, zanim ktokolwiek zdąży
  # czekać na przeglądarki.
  checks:
    name: Typy, lint, testy, build
    runs-on: ubuntu-latest
    env:
      APPS_SCRIPT_URL: https://example.invalid/exec
      APPS_SCRIPT_SECRET: browser-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wersje narzędzi
        run: node -v && npm -v && npm config get registry
      # Peery `@emnapi/core` i `@emnapi/runtime` wariantów WASM są jawnie
      # zapisane w devDependencies. Dzięki temu lockfile ma kompletny graf
      # zarówno na Windowsie, jak i na runnerze linuksowym, a CI może zachować
      # deterministyczną instalację zamiast naprawiać lockfile w locie.
      - name: Instalacja zależności
        id: install
        run: npm ci --no-audit --no-fund --foreground-scripts
      # npm kończy komunikatem „a complete log of this run can be found in…",
      # a ten plik zostaje na runnerze i nikt go nie widzi. Bez niego diagnoza
      # sprowadza się do zgadywania, więc przy porażce wypisujemy go do logu
      # zadania — razem ze stanem, który mógł ją spowodować.
      - name: Log npm po nieudanej instalacji
        if: failure() && steps.install.outcome == 'failure'
        run: |
          echo "::group::npm debug log"
          for f in /home/runner/.npm/_logs/*.log; do echo "--- $f"; tail -n 200 "$f"; done
          echo "::endgroup::"
          echo "::group::środowisko"
          uname -a; node -v; npm -v; npm config list
          echo "::endgroup::"
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Build produkcyjny przyda się testom przeglądarkowym w drugim zadaniu.
      - uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 1
          include-hidden-files: true

  browser:
    name: Dostępność, reduced-motion, mobile
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund --foreground-scripts
      - uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next
      - name: Zainstaluj przeglądarkę
        run: npx playwright install --with-deps chromium
      # Cały katalog, nie wyliczanka plików — nowy test inaczej cicho zostaje
      # poza CI (tak było z tests/not-found.spec.ts).
      - name: Testy przeglądarkowe
        run: npx playwright test
      # Raport z diagnostyki mobilnej bywa jedynym śladem, dlaczego coś przeszło
      # albo nie — trzymamy go przy przebiegu.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-findings
          path: docs/mobile/findings.json
          retention-days: 7
